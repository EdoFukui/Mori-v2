name: Keep-alive Supabase

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC — máximo 4 días entre corridas,
    # con margen frente al límite de 7 días de pausa por inactividad
    # de Supabase (free tier) y frente a los retrasos ocasionales de
    # GitHub Actions en horarios de alta carga.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: # permite ejecutarlo manualmente para probarlo

permissions:
  contents: write # necesario para que el job pueda hacer commit

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase (mantiene el proyecto activo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/ejemplares?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"

      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Registrar marca de tiempo (mantiene vivo el workflow programado)
        run: |
          mkdir -p .github
          echo "Último ping: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .github/keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: keep-alive ping $(date -u +'%Y-%m-%d')"
          git push
